{% extends "base.html" %}{% block content %}<div class="heading"><div class="eyebrow">TICKET INTAKE</div><h1>Submit an issue</h1><p>Our ML engine will classify it, estimate priority and find related tickets.</p></div><form class="panel form" method="post"><label>Your name<input name="requester" required placeholder="Name"></label><label>Email (optional)<input name="email" type="email" placeholder="you@example.com"></label><label>Issue title<input name="title" required placeholder="e.g. Wi-Fi has no internet"></label><label>Describe the issue<textarea name="description" rows="5" required placeholder="What happened? What have you tried?"></textarea></label><button class="btn">Analyze & submit ticket</button></form>{% endblock %}
